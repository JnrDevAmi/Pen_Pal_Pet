<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pen-pal Pet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stripe" aria-hidden="true"></div>

<nav class="rail" id="rail" aria-label="Pen-pal Pet"></nav>

<main class="stage" id="stage">
  <div class="pets" id="pets"></div>
  <button class="floor-mail hit" id="floor-mail" type="button" hidden aria-label="Notes waiting to be picked up">
    <svg viewBox="0 0 46 34" aria-hidden="true">
      <rect x="6" y="6" width="34" height="22" rx="2" fill="#f5efe0" stroke="#1f2433" stroke-width="1.5" transform="rotate(-8 23 17)"/>
      <rect x="4" y="10" width="34" height="22" rx="2" fill="#fffdf6" stroke="#1f2433" stroke-width="1.5"/>
      <path d="M5 11 L21 23 L37 11" fill="none" stroke="#1f2433" stroke-width="1.5"/>
      <path d="M4 30 h5 M12 30 h5 M20 30 h5 M28 30 h5" stroke="#2b4ba0" stroke-width="2.5"/>
    </svg>
    <span class="count" id="floor-count">1</span>
  </button>
</main>

<footer class="statusbar" id="statusbar">
  <span class="sb-pet" id="sb-pet" aria-hidden="true"></span>
  <span class="sb-text" id="sb-text" aria-live="polite"></span>
  <span class="sb-clock" id="sb-clock"></span>
</footer>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
