name: Build installers

# Builds the Windows installer for Pen-pal Pet.
#
#   Tag a version  ->  a public Release appears with the installer attached,
#                      which is the link you give people.
#   Run by hand    ->  it lands in the run's Artifacts, fine for checking a
#                      build but no good for users: those need a GitHub login
#                      and expire after 90 days.
#
# Windows only, deliberately. The app has never been built or run on macOS or
# Linux, so shipping either would be claiming something nobody has checked.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: app
        run: npm install

      # Only the suites that are deterministic on a CI runner. The rest of the
      # tests open real UDP multicast sockets and drive a real window, neither
      # of which a hosted runner reliably provides - running them here would
      # block releases on the runner's networking rather than on the code.
      # Run the full suite locally with: cd app && npm test
      - name: Test (logic, IPC surface and hardening audit)
        working-directory: app
        run: |
          node --test ../test/06-units.js
          node --test ../test/07-ipc.js
          node --test ../test/08-hardening.js

      - name: Build
        working-directory: app
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: penpal-pet-windows
          path: app/dist/*.exe
          if-no-files-found: error

  # Only on a tag: gather what the three runners built and publish it as a
  # Release, so the installers have permanent public download links.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: List what the runners produced
        run: ls -lh installers

      # People download a zip, unzip it and run the wizard, so ship the
      # installer with a plain-language note beside it.
      - name: Bundle the Windows installer with its instructions
        run: |
          setup=$(ls installers/*Setup*.exe 2>/dev/null | head -1) || true
          if [ -n "$setup" ]; then
            ver="${GITHUB_REF_NAME#v}"
            dir="Pen-pal-Pet-$ver-Windows"
            mkdir -p "$dir"
            cp "$setup" "$dir/"
            cp docs/READ-ME-FIRST.txt "$dir/READ ME FIRST.txt"
            zip -r -q "installers/$dir.zip" "$dir"
            echo "bundled $dir.zip"
          else
            echo "no Windows installer in this run; skipping the zip"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          draft: false
          # Off: this appends GitHub's own commit list and a "Full Changelog"
          # link. The notes below are for someone who wants to install the app,
          # not read its history.
          generate_release_notes: false
          body: |
            **Windows only.** Download the zip, unzip it, and run the setup
            wizard inside. Nothing else is needed - no Node, no npm.

            | File | What to do |
            | --- | --- |
            | `Pen-pal-Pet-*-Windows.zip` | Unzip and run the setup wizard. No administrator password needed. |
            | `Pen-pal-Pet-*-portable.exe` | Runs straight from the file. Nothing is installed. |

            It is not code-signed, so Windows shows a blue "Windows protected
            your PC" notice. Click More info, then Run anyway. That means the
            publisher is unverified, not that anything is wrong with the file.

            There is no macOS or Linux build. The app has never been run on
            either, so nothing is offered for them yet.

            On first run your computer asks whether to allow Pen-pal Pet through
            the firewall. Say yes, and tick **Private networks only**.
