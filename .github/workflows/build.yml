name: Build installers

# Builds Pen-pal Pet for Windows, macOS and Linux. Run it from the Actions tab
# ("Run workflow"), then download the installers from the run's Artifacts
# section. The macOS build has to happen here, because a .dmg can only be made
# on a Mac.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            name: windows
          - os: macos-latest
            target: --mac
            name: macos
          - os: ubuntu-latest
            target: --linux
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: app
        run: npm install
      - name: Build
        working-directory: app
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: penpal-pet-${{ matrix.name }}
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.AppImage
          if-no-files-found: warn
