name: Build installers

# Builds the Windows installer for Pen-pal Pet.
#
#   Tag a version  ->  a public Release appears with the installer attached,
#                      which is the link you give people.
#   Run by hand    ->  it lands in the run's Artifacts, fine for checking a
#                      build but no good for users: those need a GitHub login
#                      and expire after 90 days.
#
# Windows only, deliberately. The app has never been built or run on macOS or
# Linux, so shipping either would be claiming something nobody has checked.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: app
        run: npm install

      # Only the suites that are deterministic on a CI runner. The rest of the
      # tests open real UDP multicast sockets and drive a real window, neither
      # of which a hosted runner reliably provides - running them here would
      # block releases on the runner's networking rather than on the code.
      # Run the full suite locally with: cd app && npm test
      - name: Test (logic, IPC surface and hardening audit)
        working-directory: app
        run: |
          node --test ../test/06-units.js
          node --test ../test/07-ipc.js
          node --test ../test/08-hardening.js

      - name: Build
        working-directory: app
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: penpal-pet-windows
          path: app/dist/*.exe
          if-no-files-found: error

  # Only on a tag: gather what the three runners built and publish it as a
  # Release, so the installers have permanent public download links.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: List what the runners produced
        run: ls -lh installers

      # People download a zip, unzip it and run the wizard, so ship the
      # installer with a plain-language note beside it.
      - name: Bundle the Windows installer with its instructions
        run: |
          setup=$(ls installers/*Setup*.exe 2>/dev/null | head -1) || true
          if [ -n "$setup" ]; then
            ver="${GITHUB_REF_NAME#v}"
            dir="Pen-pal-Pet-$ver-Windows"
            mkdir -p "$dir"
            cp "$setup" "$dir/"
            cp docs/READ-ME-FIRST.txt "$dir/READ ME FIRST.txt"
            zip -r -q "installers/$dir.zip" "$dir"
            echo "bundled $dir.zip"
          else
            echo "no Windows installer in this run; skipping the zip"
          fi

      # Published with GitHub's own CLI rather than a third-party action:
      # one less dependency in the chain, and it fails loudly.
      #
      # The release is deleted and recreated every run, so re-tagging never
      # leaves stale assets attached - which is how a macOS build from six
      # hours earlier survived several rebuilds.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          zip=$(ls installers/*Windows.zip | head -1)
          echo "publishing $zip"
          gh release delete "$GITHUB_REF_NAME" --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create "$GITHUB_REF_NAME" "$zip" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
