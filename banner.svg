<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Pen-pal Pet — notes that walk across your Wi-Fi">
<title>Pen-pal Pet — notes that walk across your Wi-Fi</title>

<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#232f57"/>
    <stop offset="0.55" stop-color="#1b2545"/>
    <stop offset="1" stop-color="#121a33"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2a3866" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#151d38" stop-opacity="1"/>
  </linearGradient>
  <linearGradient id="screenL" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3c5aa6"/><stop offset="1" stop-color="#22345f"/>
  </linearGradient>
  <linearGradient id="screenR" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2f4a8c"/><stop offset="1" stop-color="#1d2c52"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8fb4ff" stop-opacity="0.30"/>
    <stop offset="1" stop-color="#8fb4ff" stop-opacity="0"/>
  </linearGradient>

  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1.4" fill="#ffffff" opacity="0.07"/>
  </pattern>

  <!-- airmail rope, used along both long edges -->
  <pattern id="airmail" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="34" height="34" fill="#fffdf6"/>
    <rect width="34" height="9" y="0" fill="#d6423b"/>
    <rect width="34" height="9" y="17" fill="#2b4ba0"/>
  </pattern>

  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#070b18" flood-opacity="0.55"/>
  </filter>
  <filter id="tight" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#070b18" flood-opacity="0.5"/>
  </filter>

  <!-- one cat, drawn once, walked twice -->
  <g id="cat">
    <g class="legs">
      <g class="leg rr far">
        <rect x="18" y="46" width="7" height="10" rx="3.5" fill="var(--pd)"/>
        <g class="shin">
          <rect x="18.3" y="54" width="6.4" height="8" rx="3.2" fill="var(--pd)"/>
          <rect x="17.6" y="59.5" width="7.8" height="3.6" rx="1.8" fill="var(--pd)"/>
        </g>
      </g>
      <g class="leg rl">
        <rect x="27" y="46" width="7" height="10" rx="3.5" fill="var(--pd)"/>
        <g class="shin">
          <rect x="27.3" y="54" width="6.4" height="8" rx="3.2" fill="var(--pd)"/>
          <rect x="26.6" y="59.5" width="7.8" height="3.6" rx="1.8" fill="var(--pd)"/>
        </g>
      </g>
      <g class="leg fr far">
        <rect x="44" y="46" width="7" height="10" rx="3.5" fill="var(--pd)"/>
        <g class="shin">
          <rect x="44.3" y="54" width="6.4" height="8" rx="3.2" fill="var(--pd)"/>
          <rect x="43.6" y="59.5" width="7.8" height="3.6" rx="1.8" fill="var(--pd)"/>
        </g>
      </g>
      <g class="leg fl">
        <rect x="53" y="46" width="7" height="10" rx="3.5" fill="var(--pd)"/>
        <g class="shin">
          <rect x="53.3" y="54" width="6.4" height="8" rx="3.2" fill="var(--pd)"/>
          <rect x="52.6" y="59.5" width="7.8" height="3.6" rx="1.8" fill="var(--pd)"/>
        </g>
      </g>
    </g>
    <g class="tail"><path d="M17 40 C6 36 5 24 11 17" fill="none" stroke="var(--pd)" stroke-width="5" stroke-linecap="round"/></g>
    <g class="body-g">
      <ellipse cx="38" cy="43" rx="24" ry="13" fill="var(--pc)"/>
      <path d="M51 25 L53 7 L63 18 Z" fill="var(--pc)"/>
      <path d="M65 18 L74 7 L76 26 Z" fill="var(--pc)"/>
      <path d="M54.5 20 L55.3 12 L59.5 16.5 Z" fill="var(--pd)" opacity=".55"/>
      <path d="M68.5 16.5 L72.5 12 L73 20 Z" fill="var(--pd)" opacity=".55"/>
      <circle cx="63" cy="30" r="13" fill="var(--pc)"/>
      <circle cx="59.5" cy="28.5" r="2.1" fill="#1f2433"/>
      <circle cx="68.5" cy="28.5" r="2.1" fill="#1f2433"/>
      <path d="M62.3 33 q1.9 1.7 3.8 0" stroke="#1f2433" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <circle cx="56.5" cy="33" r="2.3" fill="#ff7f7f" opacity=".45"/>
      <circle cx="72" cy="33" r="2.3" fill="#ff7f7f" opacity=".45"/>
      <g class="carry" transform="translate(68 31) rotate(-10)">
        <rect x="0" y="0" width="20" height="13" rx="1.5" fill="#fffdf6" stroke="#1f2433" stroke-width="1.1"/>
        <path d="M0.8 1 L10 7.6 L19.2 1" fill="none" stroke="#1f2433" stroke-width="1.1" stroke-linejoin="round"/>
        <rect x="2" y="9.8" width="3" height="1.6" fill="#d6423b"/><rect x="6.5" y="9.8" width="3" height="1.6" fill="#2b4ba0"/>
        <rect x="11" y="9.8" width="3" height="1.6" fill="#d6423b"/><rect x="15.5" y="9.8" width="3" height="1.6" fill="#2b4ba0"/>
      </g>
    </g>
  </g>
</defs>

<style>
  .ui { font-family: "Segoe UI", "SF Pro Text", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
  .hand { font-family: "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", cursive; }

  /* ---- the walk: out with a note, home again ---- */
  #walker { animation: walk 13s cubic-bezier(.42,0,.58,1) infinite; }
  @keyframes walk {
    0%   { transform: translate(210px, 0px) scaleX(1); }
    38%  { transform: translate(880px, 0px) scaleX(1); }
    44%  { transform: translate(880px, 0px) scaleX(-1); }
    46%  { transform: translate(880px, 0px) scaleX(-1); }
    88%  { transform: translate(210px, 0px) scaleX(-1); }
    94%  { transform: translate(210px, 0px) scaleX(1); }
    100% { transform: translate(210px, 0px) scaleX(1); }
  }
  /* a small bob, so the walk has weight */
  #bob { animation: bob 0.26s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.8px); } }

  /* A lateral-sequence walk: each foot lands a quarter-cycle after the last,
     front-right, rear-left, front-left, rear-right - the gait a real dog or
     cat uses, so three feet are always down. fill-box because a percentage
     origin would otherwise resolve against the whole 1280px canvas. */
  .leg, .shin { transform-box: fill-box; transform-origin: 50% 0%; }
  .leg.far { filter: brightness(.82); }
  .leg.fr { animation: stride .52s linear infinite; }
  .leg.rl { animation: stride .52s linear -.13s infinite; }
  .leg.fl { animation: stride .52s linear -.26s infinite; }
  .leg.rr { animation: stride .52s linear -.39s infinite; }
  .leg.fr .shin { animation: knee .52s linear infinite; }
  .leg.rl .shin { animation: knee .52s linear -.13s infinite; }
  .leg.fl .shin { animation: knee .52s linear -.26s infinite; }
  .leg.rr .shin { animation: knee .52s linear -.39s infinite; }
  @keyframes stride {
    0%   { transform: rotate(27deg)  translateY(0); }
    32%  { transform: rotate(6deg)   translateY(0); }
    66%  { transform: rotate(-23deg) translateY(0); }
    74%  { transform: rotate(-17deg) translateY(-4px); }
    86%  { transform: rotate(8deg)   translateY(-5px); }
    95%  { transform: rotate(23deg)  translateY(-1.5px); }
    100% { transform: rotate(27deg)  translateY(0); }
  }
  @keyframes knee {
    0%   { transform: rotate(-6deg); }
    40%  { transform: rotate(0deg); }
    66%  { transform: rotate(6deg); }
    74%  { transform: rotate(30deg); }
    86%  { transform: rotate(22deg); }
    96%  { transform: rotate(-2deg); }
    100% { transform: rotate(-6deg); }
  }

  .tail { transform-box: fill-box; transform-origin: 100% 100%; animation: sway 1.5s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(9deg); } }

  /* the envelope is handed over at the far desk and collected on the way back */
  .carry { animation: carry 13s linear infinite; }
  @keyframes carry {
    0%,38%    { opacity: 1; }
    40%,86%   { opacity: 0; }
    88%,100%  { opacity: 1; }
  }

  /* a reply envelope pops onto the far screen once the pet arrives */
  #reply { transform-box: fill-box; transform-origin: 50% 100%; animation: reply 13s ease-out infinite; }
  @keyframes reply {
    0%,38%    { opacity: 0; transform: scale(.4) translateY(6px); }
    44%,84%   { opacity: 1; transform: scale(1) translateY(0); }
    90%,100%  { opacity: 0; transform: scale(.4) translateY(6px); }
  }

  #glowL { animation: pulse 13s ease-in-out infinite; }
  #glowR { animation: pulseR 13s ease-in-out infinite; }
  @keyframes pulse  { 0%,10%,92%,100% { opacity: .95; } 40%,80% { opacity: .35; } }
  @keyframes pulseR { 0%,30% { opacity: .35; } 46%,84% { opacity: .95; } 96%,100% { opacity: .35; } }

  #title { animation: float 6s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

  .spark { animation: spark 13s ease-in-out infinite; }
  @keyframes spark { 0%,34% { opacity: 0; } 40%,44% { opacity: .85; } 50%,100% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    #walker, #bob, .leg, .shin, .tail, .carry, #reply, #glowL, #glowR, #title, .spark { animation: none; }
  }
</style>

<!-- backdrop -->
<rect width="1280" height="400" fill="url(#sky)"/>
<rect width="1280" height="400" fill="url(#dots)"/>

<!-- perspective floor: the plane the pet walks on -->
<path d="M0 268 L1280 268 L1280 400 L0 400 Z" fill="url(#floor)"/>
<path d="M0 268 L1280 268" stroke="#6f86c7" stroke-opacity="0.35" stroke-width="1.5"/>
<!-- receding guide lines give the floor its depth -->
<g stroke="#8fb4ff" stroke-opacity="0.10" stroke-width="1.5">
  <path d="M470 268 L300 400"/><path d="M560 268 L500 400"/>
  <path d="M640 268 L640 400"/>
  <path d="M720 268 L780 400"/><path d="M810 268 L980 400"/>
</g>

<!-- airmail ropes along the long edges -->
<rect x="0" y="0" width="1280" height="11" fill="url(#airmail)"/>
<rect x="0" y="389" width="1280" height="11" fill="url(#airmail)"/>

<!-- title, extruded -->
<g id="title">
  <g class="ui" font-size="74" font-weight="700" text-anchor="middle" letter-spacing="-1">
    <text x="640" y="150" fill="#0d1428" opacity=".55" transform="translate(7,7)">Pen-pal Pet</text>
    <text x="640" y="150" fill="#16224a" transform="translate(5,5)">Pen-pal Pet</text>
    <text x="640" y="150" fill="#24356b" transform="translate(3,3)">Pen-pal Pet</text>
    <text x="640" y="150" fill="#f5efe0">Pen-pal Pet</text>
  </g>
  <text x="640" y="188" text-anchor="middle" class="hand" font-size="27" fill="#cdd8f2" opacity=".95">
    notes that walk across your Wi-Fi
  </text>
  <g text-anchor="middle" class="ui" font-size="14.5" fill="#93a7d8" letter-spacing="1.6">
    <text x="640" y="222">NO SERVER &#160;·&#160; NO ACCOUNTS &#160;·&#160; END-TO-END ENCRYPTED</text>
  </g>
</g>

<!-- left computer (isometric) -->
<g filter="url(#soft)">
  <!-- desk slab -->
  <path d="M96 300 L236 282 L292 306 L152 328 Z" fill="#1d2848"/>
  <path d="M96 300 L152 328 L152 338 L96 310 Z" fill="#141c36"/>
  <path d="M152 328 L292 306 L292 316 L152 338 Z" fill="#18213e"/>
  <!-- screen, tilted back -->
  <path d="M120 204 L246 188 L246 288 L120 300 Z" fill="#0e1631"/>
  <path d="M126 210 L240 195 L240 282 L126 294 Z" fill="url(#screenL)"/>
  <path id="glowL" d="M126 210 L240 195 L240 282 L126 294 Z" fill="url(#glow)"/>
  <!-- stand -->
  <path d="M170 300 L196 297 L200 312 L166 316 Z" fill="#101833"/>
</g>
<!-- tiny window on the left screen -->
<g opacity=".8">
  <rect x="140" y="222" width="82" height="9" rx="4" fill="#cfe0ff" opacity=".55"/>
  <rect x="140" y="238" width="60" height="7" rx="3.5" fill="#cfe0ff" opacity=".35"/>
  <rect x="140" y="252" width="70" height="7" rx="3.5" fill="#cfe0ff" opacity=".28"/>
</g>

<!-- right computer (isometric, mirrored) -->
<g filter="url(#soft)">
  <path d="M1184 300 L1044 282 L988 306 L1128 328 Z" fill="#1d2848"/>
  <path d="M1184 300 L1128 328 L1128 338 L1184 310 Z" fill="#141c36"/>
  <path d="M1128 328 L988 306 L988 316 L1128 338 Z" fill="#18213e"/>
  <path d="M1160 204 L1034 188 L1034 288 L1160 300 Z" fill="#0e1631"/>
  <path d="M1154 210 L1040 195 L1040 282 L1154 294 Z" fill="url(#screenR)"/>
  <path id="glowR" d="M1154 210 L1040 195 L1040 282 L1154 294 Z" fill="url(#glow)"/>
  <path d="M1110 300 L1084 297 L1080 312 L1114 316 Z" fill="#101833"/>
</g>

<!-- the reply, waiting on the friend's screen -->
<g id="reply">
  <g transform="translate(1068 222) scale(1.6)">
    <rect x="0" y="0" width="20" height="13" rx="1.5" fill="#f2c14e" stroke="#1f2433" stroke-width="1.1"/>
    <path d="M0.8 1 L10 7.6 L19.2 1" fill="none" stroke="#1f2433" stroke-width="1.1" stroke-linejoin="round"/>
  </g>
</g>
<!-- little arrival sparkle -->
<g class="spark" fill="#ffe9a8">
  <circle cx="1060" cy="212" r="2.8"/><circle cx="1112" cy="216" r="2.2"/><circle cx="1088" cy="204" r="2.4"/>
</g>

<!-- the pet -->
<g id="walker">
  <g id="bob" style="--pc:#f0ad4e; --pd:#bf7a1f;" filter="url(#tight)">
    <ellipse cx="38" cy="296" rx="30" ry="6" fill="#070b18" opacity=".45"/>
    <g transform="translate(0 232) scale(1.05)">
      <use href="#cat"/>
    </g>
  </g>
</g>

<!-- dashed route, so the journey reads even in a still frame -->
<path d="M250 300 C480 276, 800 276, 1000 300" fill="none"
      stroke="#8fb4ff" stroke-opacity=".22" stroke-width="2" stroke-dasharray="7 9" stroke-linecap="round"/>
</svg>
